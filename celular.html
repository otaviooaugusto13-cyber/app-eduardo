<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Praticamente | Evolução da Mente</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
/* --- RESET E BASE --- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #050505; color: #fff; line-height: 1.6; overflow-x: hidden; }

/* Estrutura Principal */
.app { display: flex; flex-direction: column; min-height: 100vh; }

/* --- SIDEBAR (Só aparece no Desktop) --- */
.sidebar { width: 260px; background: #111; padding: 30px 20px; border-right: 1px solid #222; flex-shrink: 0; display: none; }
.logo { margin-bottom: 40px; font-size: 22px; font-weight: bold; text-transform: uppercase; }
.logo .pratica { color: #e0e0e0; } .logo .mente { color: #007bff; }    
.sidebar nav a { display: block; padding: 12px 15px; color: #bbb; text-decoration: none; border-radius: 8px; margin-bottom: 8px; transition: 0.3s; }
.sidebar nav a:hover { background: #1a1a1a; color: #007bff; }
.progress-box { margin-top: auto; padding-top: 20px; border-top: 1px solid #222; }
.progress-bar { width: 100%; height: 6px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 5px; }
.progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #007bff, #00c6ff); }

/* --- CONTEÚDO PRINCIPAL --- */
main { flex: 1; padding: 20px; width: 100%; max-width: 1200px; margin: 0 auto; position: relative; padding-bottom: 40px; }

/* Desktop Adjustment */
@media (min-width: 769px) {
    .app { flex-direction: row; }
    .sidebar { display: flex; flex-direction: column; }
    main { padding: 40px; }
}

/* Views */
section { display: none; }
#main-view { display: block; animation: fadeIn 0.5s; }

/* Grid de Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; } /* Ajustado para mobile */

/* Cards Estilo Netflix */
.card { 
    height: 220px; /* Altura ajustada para mobile */
    border-radius: 16px; padding: 15px; cursor: pointer; 
    display: flex; flex-direction: column; justify-content: flex-end; 
    position: relative; overflow: hidden; 
    background-color: #1a1a1a; border: 1px solid #222;
    transition: transform 0.3s;
}
.card:active { transform: scale(0.98); }

.card-gradient { background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.2) 100%); position: absolute; inset: 0; z-index: 1; }
.card-content { position: relative; z-index: 2; }
.card-badge { font-size: 9px; font-weight: 800; color: #fff; background: #007bff; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
.card-title { font-size: 16px; color: #fff; font-weight: 700; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

/* Bloqueio */
.card.locked { filter: grayscale(100%); opacity: 0.6; }
.card.locked::before { content: '\f023'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #fff; z-index: 3; background: rgba(0,0,0,0.6); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

/* Backgrounds */
.bg-eneagrama { background-image: url('Eneagrama.png'); background-size: cover; background-position: center; }
.bg-pnl { background-image: url('PNL.png'); background-size: cover; background-position: center; }
.bg-estoicismo { background-image: url('estoicismo.png'); background-size: cover; background-position: center; }
.bg-familia { background-image: url('familia.png'); background-size: cover; background-position: center; } 
.bg-curso { background-image: url('curso.png'); background-size: cover; background-position: center; }
.bg-ebook { background-image: url('livros.png'); background-size: cover; background-position: center; }

/* Header Home */
.header-home { margin-bottom: 25px; padding-top: 10px; }
.header-home h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 5px; }
.header-home p { color: #888; font-size: 14px; }

/* --- TELA DE AULAS --- */
#module-content { padding-top: 20px; }
.btn-back { background: transparent; color: #007bff; border: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; cursor: pointer; }
.video-frame { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.lesson-item { background: #161616; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
.lesson-link { color: #fff; font-weight: 600; text-decoration: none; font-size: 14px; flex: 1; }
.btn-pdf { background: #222; color: #888; padding: 8px 12px; border-radius: 6px; font-size: 12px; text-decoration: none; }

/* =========================================
   CHAT SÊNECA (PREMIUM & TELA CHEIA)
   ========================================= */
#chat-view {
    /* CORREÇÃO: Agora ocupa a tela inteira sobrepondo tudo */
    position: fixed; 
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    background-color: #000; 
    background-image: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
    z-index: 9999; /* Fica acima de tudo */
    display: none; 
    flex-direction: column;
}
#chat-view.active { display: flex; }

/* Header do Chat */
.chat-header {
    background: rgba(20, 20, 20, 0.85); 
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    padding: 15px 20px; display: flex; align-items: center; gap: 15px;
    border-bottom: 1px solid #222;
    padding-top: max(15px, env(safe-area-inset-top)); /* Respeita o notch do iPhone */
}
.chat-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #007bff; overflow: hidden; box-shadow: 0 0 10px rgba(0,123,255,0.4); }
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-info h3 { font-size: 16px; font-weight: 700; color: #fff; margin: 0; }
.chat-info span { font-size: 12px; color: #00ff88; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.chat-info span::before { content: ''; width: 6px; height: 6px; background: #00ff88; border-radius: 50%; display: block; box-shadow: 0 0 5px #00ff88; }

/* Corpo das Mensagens */
.chat-body { 
    flex: 1; 
    padding: 20px; 
    overflow-y: auto; 
    display: flex; flex-direction: column; gap: 12px; 
    background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Textura leve */
    background-opacity: 0.05;
}

.message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; position: relative; animation: slideUp 0.3s ease-out; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.message.received { background: #1f1f1f; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
.message.sent { background: linear-gradient(135deg, #007bff 0%, #0062cc 100%); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg-time { font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 4px; display: block; }

/* Footer do Chat */
.chat-footer {
    background: #111; 
    padding: 10px 15px; 
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px; border-top: 1px solid #222;
}
.chat-input-wrapper { flex: 1; background: #222; border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; border: 1px solid #333; }
.chat-input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 15px; padding: 8px 0; }
.chat-send-btn { 
    width: 45px; height: 45px; border-radius: 50%; background: #007bff; border: none; color: #fff; 
    display: flex; align-items: center; justify-content: center; font-size: 18px; 
    box-shadow: 0 4px 10px rgba(0,123,255,0.3); transition: 0.2s;
}
.chat-send-btn:active { transform: scale(0.9); }

/* Botão Microfone */
.icon-btn { background: transparent; border: none; color: #666; font-size: 18px; padding: 0 5px; margin-right: 5px; }
.listening { color: #ff3b30 !important; animation: pulse 1s infinite; }

/* --- BOLINHA FLUTUANTE (FAB) --- */
.seneca-float {
    position: fixed; 
    bottom: 30px; 
    right: 20px; 
    width: 60px; height: 60px; 
    border-radius: 50%;
    /* Borda brilhante para destacar do fundo */
    border: 3px solid #007bff; 
    box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 15px rgba(0,123,255,0.4);
    cursor: pointer; z-index: 4000; 
    background: #000; 
    transition: transform 0.2s;
}
.seneca-float img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.seneca-float:active { transform: scale(0.9); }
.online-dot { 
    position: absolute; bottom: 3px; right: 3px; 
    width: 14px; height: 14px; 
    background-color: #00ff88; 
    border: 2px solid #000; 
    border-radius: 50%; 
    box-shadow: 0 0 5px #00ff88;
}

/* --- MENU INFERIOR (CORRIGIDO: Agora é parte do fluxo, não fixo) --- */
.mobile-nav { 
    margin-top: auto; /* Empurra para o final */
    background: #0a0a0a; 
    padding: 30px 20px; 
    border-top: 1px solid #222;
    display: flex; justify-content: space-around;
}
.mobile-nav-item {
    text-align: center; color: #666; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.mobile-nav-item i { font-size: 20px; margin-bottom: 2px; }
.mobile-nav-item.active { color: #007bff; }
.mobile-nav-item.logout { color: #ff3b30; }

@media (min-width: 769px) { .mobile-nav, .seneca-float { display: none !important; } }

/* Animações */
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

</style>
</head>
<body>

<div class="app">
  
  <aside class="sidebar">
    <div class="logo"><span class="pratica">Pratica</span><span class="mente">mente</span></div>
    <nav>
      <a href="#" onclick="goHome()">Módulos</a>
      <a href="conta.html">Minha Conta</a>
      <a href="certificados.html">Certificados</a>
      <a href="#" onclick="alert('Suporte')">Suporte</a>
    </nav>
  </aside>

  <main>
    <section id="main-view">
      <div class="header-home">
        <h1>Olá, Otávio</h1> <p>Continue sua evolução.</p>
      </div>
      
      <div class="cards">
        <div id="mod-eneagrama" class="card bg-eneagrama" onclick="tryOpen('Eneagrama', 'eneagrama', 'LinkVideo')">
          <div class="card-gradient"></div><div class="card-lock"><i class="fas fa-lock"></i></div>
          <div class="card-content"><span class="card-badge">Módulo 01</span><h3 class="card-title">Eneagrama</h3></div>
        </div>
        
        <div id="mod-pnl" class="card bg-pnl" onclick="tryOpen('PNL', 'pnl', 'LinkVideo')">
          <div class="card-gradient"></div><div class="card-lock"><i class="fas fa-lock"></i></div>
          <div class="card-content"><span class="card-badge">Módulo 02</span><h3 class="card-title">PNL Aplicada</h3></div>
        </div>
        
        <div id="mod-estoicismo" class="card bg-estoicismo" onclick="tryOpen('Estoicismo', 'completo', 'LinkVideo')">
          <div class="card-gradient"></div><div class="card-lock"><i class="fas fa-lock"></i></div>
          <div class="card-content"><span class="card-badge">Módulo 03</span><h3 class="card-title">Estoicismo</h3></div>
        </div>
        
        <div id="mod-familia" class="card bg-familia" onclick="tryOpen('Família', 'completo', 'LinkVideo')">
          <div class="card-gradient"></div><div class="card-lock"><i class="fas fa-lock"></i></div>
          <div class="card-content"><span class="card-badge">Módulo 04</span><h3 class="card-title">Família</h3></div>
        </div>

        <div id="mod-completo" class="card bg-curso" onclick="tryOpen('Curso Completo', 'completo', 'LinkVideo')">
          <div class="card-gradient"></div><div class="card-lock"><i class="fas fa-lock"></i></div>
          <div class="card-content"><span class="card-badge">Módulo 05</span><h3 class="card-title">Método PráticaMente</h3></div>
        </div>
        
        <div id="mod-ebooks" class="card bg-ebook" onclick="tryOpen('E-books', 'ebooks', '')">
          <div class="card-gradient"></div><div class="card-lock"><i class="fas fa-lock"></i></div>
          <div class="card-content"><span class="card-badge">Biblioteca</span><h3 class="card-title">E-books</h3></div>
        </div>
        </div>
    </section>

    <section id="module-content">
      <button class="btn-back" onclick="closeModule()"><i class="fas fa-arrow-left"></i> Voltar</button>
      <h2 id="mod-title" style="margin-bottom: 20px; font-size: 20px;">Título</h2>
      <div id="video-box" class="video-frame">
        <iframe id="mod-video" src="" allowfullscreen width="100%" height="100%" frameborder="0"></iframe>
      </div>
      <div id="lessons-container"></div>
    </section>

  </main>

  <nav class="mobile-nav">
      <a href="#" onclick="goHome()" class="mobile-nav-item active">
          <i class="fas fa-th-large"></i> Módulos
      </a>
      <a href="certificados.html" class="mobile-nav-item">
          <i class="fas fa-certificate"></i> Certificados
      </a>
      <a href="#" onclick="alert('Suporte via WhatsApp')" class="mobile-nav-item">
          <i class="fas fa-headset"></i> Suporte
      </a>
      <a href="#" onclick="logout()" class="mobile-nav-item logout">
          <i class="fas fa-sign-out-alt"></i> Sair
      </a>
  </nav>

  <div class="seneca-float" onclick="openChatInterface()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Pseudo-Seneca.jpg" alt="Sêneca">
      <div class="online-dot"></div>
  </div>

  <section id="chat-view">
      <div class="chat-header">
          <button onclick="closeChat()" style="background:none; border:none; color:#fff; font-size:20px; margin-right:10px;"><i class="fas fa-arrow-left"></i></button>
          <div class="chat-avatar"><img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Pseudo-Seneca.jpg"></div>
          <div class="chat-info">
              <h3>Sêneca</h3>
              <span>Online</span>
          </div>
      </div>

      <div class="chat-body" id="chat-body"></div>

      <div class="chat-footer">
          <div class="chat-input-wrapper">
              <input type="text" id="chat-input" class="chat-input" placeholder="Mensagem..." autocomplete="off">
              <button id="mic-btn" class="icon-btn" onclick="startDictation()"><i class="fas fa-microphone"></i></button>
          </div>
          <button class="chat-send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
  </section>

</div>

<script>
// --- CONFIGURAÇÃO ---
const userPlan = localStorage.getItem('praticamente_plano');
const userName = localStorage.getItem('praticamente_nome') || 'Otávio';
const API_KEY = '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'; // Groq Key

if (!userPlan) window.location.href = 'login.html';

// Instruções para a IA
const systemInstruction = `
Você é Sêneca, mentor estoico. Ajude ${userName}.
Use sabedoria do Estoicismo, PNL e Gestão.
Seja breve, direto e prático (max 3 frases).
Fale Português Brasil.
`;

let conversationHistory = JSON.parse(localStorage.getItem('seneca_history')) || [{ role: "system", content: systemInstruction }];

window.onload = function() {
    aplicarBloqueios();
    renderHistory();
    
    // Boas vindas se for vazio
    if (conversationHistory.length === 1) {
        addMessage(`Olá, ${userName}. Estou à disposição.`, 'received', false);
    }

    const chatInput = document.getElementById('chat-input');
    if(chatInput) chatInput.addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage(); });
};

// --- NAVEGAÇÃO ---
function goHome() {
    document.getElementById('main-view').style.display = 'block';
    document.querySelector('.mobile-nav').style.display = 'flex'; // Mostra menu
    document.querySelector('.seneca-float').style.display = 'flex'; // Mostra bolinha
    
    document.getElementById('module-content').style.display = 'none';
    document.getElementById('chat-view').classList.remove('active'); // Esconde chat
    document.getElementById('mod-video').src = '';
}

function openChatInterface() {
    if(userPlan !== 'completo') { alert("🔒 Recurso exclusivo plano Completo."); return; }
    
    // Abre Chat Fullscreen
    const chat = document.getElementById('chat-view');
    chat.classList.add('active');
    
    // Esconde a bolinha para não atrapalhar o chat
    document.querySelector('.seneca-float').style.display = 'none';
    scrollToBottom();
}

function closeChat() {
    document.getElementById('chat-view').classList.remove('active');
    document.querySelector('.seneca-float').style.display = 'flex'; // Volta a bolinha
}

// --- CHAT LÓGICA ---
function renderHistory() {
    const chatBody = document.getElementById('chat-body');
    chatBody.innerHTML = '';
    conversationHistory.filter(m => m.role !== 'system').forEach(m => {
        const type = m.role === 'user' ? 'sent' : 'received';
        appendMessageToDOM(m.content, type);
    });
}

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return;

    addMessage(text, 'sent', true);
    input.value = '';

    try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: conversationHistory,
                max_tokens: 400
            })
        });
        const data = await response.json();
        const aiText = data.choices[0].message.content;
        addMessage(aiText, 'received', true);
    } catch (e) {
        addMessage("Erro de conexão.", 'received', false);
    }
}

function addMessage(text, type, save) {
    appendMessageToDOM(text, type);
    if(save) {
        const role = type === 'sent' ? 'user' : 'assistant';
        conversationHistory.push({ role, content: text });
        if(conversationHistory.length > 20) conversationHistory.splice(1, 1);
        localStorage.setItem('seneca_history', JSON.stringify(conversationHistory));
    }
}

function appendMessageToDOM(text, type) {
    const body = document.getElementById('chat-body');
    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    
    // Formatação leve
    let formatted = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    
    // Botão Falar
    let audioBtn = '';
    if(type === 'received') {
        const cleanText = text.replace(/'/g, "").replace(/"/g, "").replace(/\n/g, " ");
        audioBtn = `<i class="fas fa-volume-up" style="margin-left:10px; opacity:0.6;" onclick="falarTexto('${cleanText}')"></i>`;
    }

    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.innerHTML = `${formatted} ${audioBtn} <span class="msg-time">${time}</span>`;
    body.appendChild(div);
    scrollToBottom();
}

function scrollToBottom() {
    const b = document.getElementById('chat-body');
    b.scrollTop = b.scrollHeight;
}

// --- VOZ ---
function falarTexto(texto) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR'; u.rate = 1.0; u.pitch = 0.9;
    // Tenta pegar voz Google
    const voices = window.speechSynthesis.getVoices();
    const googleVoice = voices.find(v => v.name.includes("Google") && v.lang.includes("pt-BR"));
    if(googleVoice) u.voice = googleVoice;
    window.speechSynthesis.speak(u);
}

function startDictation() {
    if (window.hasOwnProperty('webkitSpeechRecognition')) {
        const r = new webkitSpeechRecognition();
        r.lang = "pt-BR";
        r.onstart = () => document.getElementById('mic-btn').classList.add('listening');
        r.onend = () => document.getElementById('mic-btn').classList.remove('listening');
        r.onresult = (e) => { 
            document.getElementById('chat-input').value = e.results[0][0].transcript;
            sendMessage();
        };
        r.start();
    } else alert("Navegador sem suporte a voz.");
}

// --- UTILITÁRIOS ---
function aplicarBloqueios() {
    if (userPlan === 'completo') return;
    const allIds = ['mod-eneagrama','mod-pnl','mod-estoicismo','mod-familia','mod-completo','mod-ebooks'];
    // Lógica simplificada: Bloqueia tudo se não for 'completo' (ajuste conforme sua regra original)
    // Se quiser manter a lógica detalhada anterior, copie e cole aqui.
    if(userPlan !== 'completo') allIds.forEach(bloquear); 
}
function bloquear(id) { const el = document.getElementById(id); if(el) el.classList.add('locked'); }

function tryOpen(name, plan, video) {
    if (userPlan === 'completo') openModule(name, video); // Simplificado para teste
    else alert("Bloqueado no seu plano.");
}

function openModule(name, videoIntro) {
    document.getElementById('main-view').style.display = 'none';
    document.querySelector('.mobile-nav').style.display = 'none'; // Esconde menu
    document.querySelector('.seneca-float').style.display = 'none'; // Esconde bolinha
    
    document.getElementById('module-content').style.display = 'block';
    document.getElementById('mod-title').innerText = name;
    document.getElementById('mod-video').src = videoIntro;
    
    // Injeta aulas fictícias (você pode expandir o objeto 'data' depois)
    const container = document.getElementById('lessons-container');
    container.innerHTML = `<div class="lesson-item"><span class="lesson-link">Aula 1: Introdução</span></div>`;
}

function closeModule() { goHome(); }
function logout() { if(confirm("Sair?")) { localStorage.removeItem('praticamente_plano'); window.location.href='login.html'; } }

</script>
</body>
</html>
