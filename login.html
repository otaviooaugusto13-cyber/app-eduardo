<script>
        // --- CONFIGURAÇÃO DAS PERMISSÕES ---
        const permissoes = {
            'SOU_LIDER': 'completo',
            'LEITOR_VIP': 'ebooks', // Esse é o código que você quer usar no link
            'PERFIL_ON': 'eneagrama',
            'MENTE_PNL': 'pnl'
        };

        function fazerLogin(codigoAutomatico) {
            // Se veio código automático do link, usa ele. Se não, pega do input.
            const codeInput = document.getElementById('accessCode');
            const code = codigoAutomatico || codeInput.value.toUpperCase().trim();
            const errorMsg = document.getElementById('msgError');

            if (permissoes[code]) {
                // 1. Grava a permissão no navegador do usuário
                localStorage.setItem('praticamente_plano', permissoes[code]);
                
                // 2. REDIRECIONAMENTO CORRIGIDO
                // Tiramos o '.html' para bater com a rota do seu servidor Render
                window.location.href = '/celular'; 
                
            } else {
                // Só mostra erro visual se a pessoa estiver digitando manualmente
                if (!codigoAutomatico) {
                    errorMsg.style.display = 'block';
                    document.querySelector('.login-box').animate([
                        { transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, 
                        { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }
                    ], { duration: 300 });
                }
            }
        }
        
        // --- DETECTOR DE LINK MÁGICO ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo'); // Lê o que está depois de ?codigo=

            if (codigoUrl) {
                // Se achou um código no link, executa o login imediatamente
                fazerLogin(codigoUrl.toUpperCase());
            }
        }

        // Permite apertar ENTER para entrar
        document.getElementById("accessCode").addEventListener("keypress", function(event) {
            if (event.key === "Enter") fazerLogin();
        });
    </script>
