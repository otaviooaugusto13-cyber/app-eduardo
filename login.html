<script>
        // --- CONFIGURAÇÃO DOS CÓDIGOS DE ACESSO ---
        const permissoes = {
            // ACESSO TOTAL
            'SOU_LIDER': 'completo',      // Código antigo (mantido por segurança)
            'CURSO_COMPLETO': 'completo', // NOVO: Para quem compra tudo
            
            // ACESSO SÓ E-BOOKS
            'LEITOR_VIP': 'ebooks',       
            
            // ACESSO SÓ ENEAGRAMA ("Minha Grama")
            'PERFIL_ON': 'eneagrama',     // Código antigo
            'CURSO_ENEAGRAMA': 'eneagrama', // NOVO: Só para o módulo Eneagrama
            
            // ACESSO SÓ PNL
            'MENTE_PNL': 'pnl',           // Código antigo
            'CURSO_PNL': 'pnl'            // NOVO: Só para o módulo PNL
        };

        function salvarERedirecionar(plano) {
            console.log("Liberando acesso para plano:", plano);
            
            // 1. Grava a permissão
            localStorage.setItem('praticamente_plano', plano);
            
            // 2. Pausa de segurança para garantir o salvamento
            setTimeout(function() {
                window.location.href = '/celular'; // Redireciona para o curso
            }, 200);
        }

        function fazerLogin(codigoAutomatico) {
            const codeInput = document.getElementById('accessCode');
            // Prioridade: Código do Link > Código digitado
            const code = codigoAutomatico || codeInput.value.toUpperCase().trim();
            const errorMsg = document.getElementById('msgError');

            if (permissoes[code]) {
                salvarERedirecionar(permissoes[code]);
            } else {
                if (!codigoAutomatico) { 
                    // Erro visual para quem digita errado
                    errorMsg.style.display = 'block';
                    document.querySelector('.login-box').animate([
                        { transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, 
                        { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }
                    ], { duration: 300 });
                } else {
                    console.log("Código do link inválido.");
                }
            }
        }
        
        // --- DETECTA O LINK MÁGICO AO CARREGAR ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo');

            if (codigoUrl) {
                fazerLogin(codigoUrl.toUpperCase());
            }
        }

        // Tecla Enter no input
        document.getElementById("accessCode").addEventListener("keypress", function(event) {
            if (event.key === "Enter") fazerLogin();
        });
    </script>
