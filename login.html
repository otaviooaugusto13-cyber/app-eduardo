<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login | Praticamente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORREÇÃO DE ALINHAMENTO (NOVO) --- */
        * { box-sizing: border-box; } /* Isso alinha magicamente todos os tamanhos */

        /* --- ESTILO VISUAL --- */
        body { 
            margin: 0; padding: 0; 
            background: #050505; 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        body::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0, 123, 255, 0.15) 0%, rgba(5,5,5,1) 70%);
            z-index: -1;
        }

        .login-box {
            background: #111; padding: 40px; border-radius: 18px;
            border: 1px solid #333; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .logo { margin-bottom: 30px; font-size: 24px; font-weight: bold; text-transform: uppercase; }
        .logo .pratica { color: #fff; } 
        .logo .mente { color: #007bff; }

        p { color: #aaa; margin-bottom: 30px; font-size: 0.9rem; }

        /* INPUT E BOTÃO COM O MESMO COMPORTAMENTO */
        input, button {
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 1rem; 
            outline: none; 
            transition: 0.3s;
            display: block; /* Garante que ocupem a linha toda */
        }

        input {
            background: #0e0e0e; border: 1px solid #333; color: #fff; 
            margin-bottom: 20px; text-align: center; letter-spacing: 2px;
        }
        input:focus { border-color: #007bff; box-shadow: 0 0 10px rgba(0, 123, 255, 0.3); }

        button {
            background: linear-gradient(90deg, #007bff, #0056b3);
            border: none; color: #fff; font-weight: bold; cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4); }
        button:disabled { background: #333; color: #aaa; cursor: not-allowed; transform: none; box-shadow: none; }

        .error { color: #ff4d4d; font-size: 0.8rem; margin-top: 15px; display: none; }
        
        /* Feedback visual quando está carregando */
        .loading-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10; align-items: center; justify-content: center;
            flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #007bff;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading-overlay">
        <div class="spinner"></div>
        <div style="color: #007bff; font-weight: bold;">Validando acesso...</div>
    </div>

    <div class="login-box">
        <div class="logo">
            <span class="pratica">Pratica</span><span class="mente">mente</span>
        </div>
        <p>Digite seu código ou use o link de acesso</p>
        
        <input type="text" id="accessCode" placeholder="CÓDIGO DE ACESSO">
        <button id="btnEntrar" onclick="fazerLogin()">ACESSAR PLATAFORMA</button>
        <div id="msgError" class="error">Código inválido.</div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DOS CÓDIGOS (Permissões) ---
        const permissoes = {
            'SOU_LIDER': 'completo',
            'CURSO_COMPLETO': 'completo',
            'LEITOR_VIP': 'ebooks',
            'PERFIL_ON': 'eneagrama',
            'CURSO_ENEAGRAMA': 'eneagrama',
            'MENTE_PNL': 'pnl',
            'CURSO_PNL': 'pnl'
        };

        function mostrarCarregando() {
            document.getElementById('loadingScreen').style.display = 'flex';
            const btn = document.getElementById('btnEntrar');
            if(btn) {
                btn.innerHTML = 'ENTRANDO...';
                btn.disabled = true;
            }
        }

        function salvarERedirecionar(plano) {
            mostrarCarregando(); 
            
            console.log("Acesso liberado:", plano);
            localStorage.setItem('praticamente_plano', plano);
            
            // Pausa de 1.5s para garantir que salvou e mostrar o loading
            setTimeout(function() {
                window.location.href = '/celular'; 
            }, 1500);
        }

        function fazerLogin(codigoAutomatico) {
            const codeInput = document.getElementById('accessCode');
            const code = codigoAutomatico || (codeInput ? codeInput.value.toUpperCase().trim() : '');
            const errorMsg = document.getElementById('msgError');

            if (permissoes[code]) {
                salvarERedirecionar(permissoes[code]);
            } else {
                if (!codigoAutomatico) {
                    if(errorMsg) errorMsg.style.display = 'block';
                    const box = document.querySelector('.login-box');
                    if(box) {
                        box.animate([
                            { transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, 
                            { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }
                        ], { duration: 300 });
                    }
                }
            }
        }
        
        // --- AO CARREGAR A PÁGINA ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo');

            if (codigoUrl) {
                mostrarCarregando();
                setTimeout(() => {
                    fazerLogin(codigoUrl.toUpperCase());
                }, 1000);
            }
        }

        // Tecla Enter
        const input = document.getElementById("accessCode");
        if(input) {
            input.addEventListener("keypress", function(event) {
                if (event.key === "Enter") fazerLogin();
            });
        }
    </script>
</body>
</html>
